<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The lead-up to the US-China rivalry</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── Tokens ── */
:root{
  --red:#E3120B; --navy:#1F2E7A; --navy-deep:#141F52;
  --blue:#2E45B8; --teal:#36E2BD; --cream:#EBE9E0;
  --ink:#0f172a; --muted:#5a5f73; --rule:#d7d9e0;
  --maxw:1320px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans',Arial,sans-serif;background:#fff;
  color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  container-type:inline-size;}  /* Enable container queries for responsive scaling */
button{font-family:inherit;cursor:pointer;border:none;background:none;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
button:focus-visible{outline:2px solid var(--blue);outline-offset:3px;}
.tl-btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
.icon-btn:focus-visible{outline:2px solid var(--teal);outline-offset:3px;}
.acc-row:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

/* ── Screen switching ── */
/* Screens fill the viewport exactly — no browser scroll ever */
html,body{height:100%;overflow:hidden;}
.screen{
  display:none;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
  opacity:0;transition:opacity 0.3s ease-in-out;
}
.screen.is-active{display:flex;opacity:1;}

/* ── APPBAR ── */
.appbar{
  position:relative;z-index:40;flex:none;
  background:#fff;
  height:60px;
  display:flex;align-items:stretch;
}
/* Inner wrapper keeps logo+title+tools within the content max-width,
   with padding matching .work-inner so content aligns perfectly */
.appbar-inner{
  width:100%;max-width:var(--maxw);margin:0 auto;
  display:flex;align-items:stretch;
  padding:0 clamp(18px,4vw,52px);
  border-bottom:1px solid var(--rule);  /* rule contained within content width */
}
.appbar-logo{flex:none;display:flex;align-items:stretch;margin-left:-clamp(18px,4vw,52px);}
.appbar-logo svg{height:100%;width:auto;display:block;}
.appbar-divider{width:1px;background:var(--rule);margin:12px 0;flex:none;}
.appbar-title{flex:1;display:flex;align-items:center;
  padding:0 16px;font-size:14px;font-weight:500;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appbar-tools{display:flex;align-items:center;gap:8px;flex:none;}
/* Icon buttons: proper circle with correct SVG sizing */
.icon-btn{
  width:36px;height:36px;border:none;background:none;padding:0;
  cursor:pointer;flex:none;display:inline-grid;place-items:center;line-height:0;
  -webkit-tap-highlight-color:transparent;position:relative;
}
.icon-btn .ic{position:absolute;inset:0;width:100%;height:100%;display:none;
  place-items:center;}
.icon-btn .ic svg{width:100%;height:100%;display:block;overflow:visible;}
.icon-btn .ic-rest{display:flex !important;place-items:center;}
.icon-btn:hover .ic-rest,.icon-btn:focus-visible .ic-rest{display:none !important;}
.icon-btn:hover .ic-over,.icon-btn:focus-visible .ic-over{display:flex !important;place-items:center;}
.icon-btn:active .ic-rest,.icon-btn:active .ic-over{display:none !important;}
.icon-btn:active .ic-pressed{display:flex !important;place-items:center;}

/* ── COVER ── */
#cover{overflow:hidden;}
.cover-stage{
  position:relative;width:100%;max-width:var(--maxw);margin:0 auto;
  flex:1;display:flex;align-items:center;
  padding:clamp(20px,4vw,56px) clamp(18px,4vw,52px);
  overflow:hidden;
}
.cover-text{position:relative;z-index:5;max-width:clamp(300px,42%,560px);}
.cover-title{font-size:clamp(34px,4.2vw,56px);font-weight:800;
  line-height:1.08;letter-spacing:-.02em;color:var(--ink);
  margin-bottom:clamp(24px,3vw,40px);}
.btn-start{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--blue);color:#fff;font-weight:700;font-size:15px;
  min-width:clamp(120px,14vw,152px);height:44px;padding:0 24px;
  border-radius:4px;cursor:pointer;transition:background .18s;}
.btn-start:hover,.btn-start:focus-visible{background:var(--navy);}

/* Cover art — inset left/right by the same padding as the stage so the
   road stays contained to the content column (no left overflow past title) */
.cover-art{
  position:absolute;top:0;bottom:0;
  left:clamp(18px,4vw,52px);right:clamp(18px,4vw,52px);
  pointer-events:none;z-index:1;
}
.cover-art-inner{
  position:absolute;left:0;right:0;top:50%;
  transform:translateY(-50%);width:100%;aspect-ratio:1340/700;
}
/* Mobile cover art (stacked layout) — hidden on desktop */
.cover-art-mobile{display:none;}
.cover-path{width:100%;height:100%;display:block;overflow:visible;}
.cover-path .road{fill:none;stroke:var(--blue);stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;}
.cover-path .arrowhead{fill:none;stroke:var(--blue);stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;}
.cover-path .node{fill:var(--navy);transform-origin:center;transform-box:fill-box;}

/* Cover floating thumbnails */
.thumb{
  position:absolute;
  width:clamp(54px,9%,76px);height:clamp(54px,9%,76px);
  transform:translate(-50%,-50%) scale(.6);opacity:0;
  transition:opacity .4s ease,transform .4s cubic-bezier(.16,1,.3,1);
  pointer-events:none;z-index:10;
}
.thumb svg,.thumb img{width:100%;height:100%;object-fit:contain;display:block;}
.thumb.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
@keyframes floaty{
  0%,100%{transform:translate(-50%,-50%) translateY(0);}
  50%{transform:translate(-50%,-50%) translateY(-7px);}
}
.thumb.show{animation:floaty 5s ease-in-out infinite;}

/* ── INTRO & EVENT: shared scrollable content area ── */
.work-outer{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
.work-inner{
  max-width:var(--maxw);
  margin:0 auto;
  padding:clamp(12px,2.5vw,28px) clamp(18px,4vw,52px) 0;
  display:flex;
  flex-direction:column;
  min-height:100%;
}
/* Intro needs a touch more headroom so the S-curve clears the appbar */
#intro .work-inner{padding-top:clamp(24px,5vh,52px);}

/* ── INTRO: S-curve panel ── */
.intro-body{
  position:relative;display:flex;align-items:center;
  min-height:clamp(240px,38vh,380px);flex:1;
}
.intro-copy{position:relative;z-index:2;max-width:clamp(280px,44%,520px);}
.intro-copy p{
  font-size:clamp(15px,1.4vw,18px);line-height:1.68;
  color:var(--ink);font-weight:400;margin-bottom:16px;
}
.intro-copy p:last-child{margin-bottom:0;}
.intro-bg{
  position:absolute;left:0;right:0;top:clamp(14px,4vh,40px);
  width:100%;aspect-ratio:1200/348;z-index:0;pointer-events:none;
}
.intro-bg svg{width:100%;height:100%;display:block;overflow:visible;}
.intro-path .road{fill:none;stroke:var(--blue);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.intro-path .arrowhead{fill:none;stroke:var(--blue);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.intro-path .ndot{fill:var(--navy);transform-origin:center;transform-box:fill-box;}
.intro-path .ndot.faint{fill:#9aa3c7;}

/* ── EVENT columns ── */
.work-body{
  display:grid;
  grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);
  gap:clamp(20px,4vw,56px);
  align-items:center;     /* centre the two columns relative to each other */
  width:100%;
  /* Auto top/bottom margins centre the block when there's room, but collapse
     to 0 when the copy is taller than the area — so .work-outer scrolls from
     the top instead of clipping the heading (fixes "milestone 1 cut off"). */
  margin:auto 0;
  padding:clamp(20px,2.5vw,36px) 0;
}
.ev-text{display:flex;flex-direction:column;}
.ev-head{display:flex;align-items:baseline;gap:clamp(10px,1.2vw,16px);flex-wrap:wrap;margin-bottom:4px;}
.ev-year{font-size:clamp(40px,5vw,62px);font-weight:800;
  color:var(--red);letter-spacing:-.02em;line-height:1;flex:none;}
.ev-title{font-size:clamp(18px,2.2vw,29px);font-weight:800;
  letter-spacing:-.015em;line-height:1.2;color:var(--ink);}
.ev-rule{height:1px;background:var(--rule);margin:14px 0 16px;}
.ev-desc{font-size:clamp(14px,1.35vw,17px);line-height:1.75;color:var(--ink);}

.ev-illo{display:flex;justify-content:center;align-items:flex-start;padding-top:clamp(4px,1vw,12px);}
.ev-illo-inner{
  width:100%;max-width:360px;
  aspect-ratio:1/1;display:grid;place-items:center;
}
.ev-illo-inner svg,.ev-illo-inner img{width:100%;height:100%;display:block;object-fit:contain;}

/* ── TIMELINE STRIP ── */
.tl-wrap{padding:clamp(14px,2vw,22px) 0 clamp(10px,1.5vw,18px);flex:none;}
.tl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tl-scroll::-webkit-scrollbar{display:none;}
.tl-track{
  display:flex;
  align-items:flex-start;  /* anchor all circles to top edge */
  padding:8px clamp(20px,3vw,40px);  /* added horizontal padding so selected buttons don't overflow edges */
  min-width:max-content;
}
/* Connector line: passes through circle centers (19px = circle radius) */
.tl-conn{
  flex:1;min-width:clamp(4px,0.8vw,14px);
  height:2px;background:rgba(31,46,122,.25);
  align-self:flex-start;margin-top:19px;
}
.tl-node{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;}
/* Number inside circle: white text, blue border only */
.tl-btn{
  width:40px;height:40px;
  border-radius:50%;border:1.5px solid var(--blue);background:#fff;
  color:var(--blue);font-weight:700;font-size:13px;
  display:grid;place-items:center;cursor:pointer;
  transition:background .2s,color .2s,box-shadow .2s,transform .18s;
}
.tl-btn:hover{background:var(--blue);color:#fff;transform:translateY(-2px);}
.tl-btn.visited{background:#eef0fb;color:var(--navy);}
.tl-btn.active{
  background:var(--navy-deep)!important;color:#fff!important;
  border-color:var(--navy-deep);
  box-shadow:0 0 0 3.5px var(--teal),0 4px 12px rgba(20,31,82,.25);
  transform:scale(1.08);
}
.tl-year{font-size:11px;font-weight:700;line-height:1.3;color:var(--ink);white-space:nowrap;}
/* Title label hidden on desktop (only shown in mobile vertical list) */
.tl-label{display:none;}
.tl-node-text{display:flex;flex-direction:column;align-items:center;}

/* Fade transition for event content swap */
.fade{transition:opacity .2s ease;}

/* ── MOBILE-ONLY ELEMENTS (hidden on desktop) ── */
.screen-title{display:none;}
.acc{display:none;}

/* ── BIB MODAL ── */
.bib-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(15,23,42,.65);backdrop-filter:blur(3px);
  z-index:200;align-items:center;justify-content:center;padding:20px;
}
.bib-overlay.open{display:flex;}
.bib-box{
  background:#fff;border-radius:10px;max-width:720px;width:100%;
  max-height:82vh;display:flex;flex-direction:column;
  box-shadow:0 16px 52px rgba(0,0,0,.24);
}
.bib-head{
  padding:18px 24px 14px;border-bottom:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;flex:none;
}
.bib-head h2{font-size:18px;font-weight:700;}
.bib-close{
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--navy);
  display:grid;place-items:center;color:var(--navy);background:#fff;
  font-size:22px;cursor:pointer;line-height:1;
  transition:background .15s,color .15s;
}
.bib-close:hover{background:var(--navy);color:#fff;}
.bib-body{padding:18px 24px;overflow-y:auto;font-size:13.5px;line-height:1.72;color:var(--muted);}
.bib-entry{
  margin-bottom:18px;padding:0 0 0 28px;
  text-indent:-28px;  /* hanging indent: first line flush, rest indented */
  font-size:14px;line-height:1.7;color:var(--ink);
  word-wrap:break-word;overflow-wrap:break-word;
}
.bib-entry em{font-style:italic;font-weight:500;color:var(--navy);}
.bib-entry:last-child{margin-bottom:0;}
.bib-entry a{color:var(--blue);text-decoration:none;}
.bib-entry a:hover{text-decoration:underline;}

/* ── SHORT VIEWPORT SAFETY NET ──────────────────────────────────
   Fixed height:100vh + overflow:hidden above is fine at normal zoom,
   but at high browser zoom / small windowed desktop / split-screen,
   the "fixed viewport" trick can clip content with no scrollbar to
   reach it. If the viewport is short, switch to natural flow instead
   of hiding overflow — same treatment as the mobile breakpoint. */
@media(max-height:550px){
  html,body{overflow:auto;height:auto;}
  .screen{height:auto;min-height:100vh;min-height:100dvh;overflow:visible;}
  #cover{overflow:visible;}
  .work-outer{overflow:visible;flex:none;}
}

/* ── MOBILE ≤700px ── */
@media(max-width:700px){
  html,body{overflow:auto;height:auto;}
  .screen{height:auto;min-height:100vh;min-height:100dvh;overflow:visible;}
  #cover{overflow:visible;}   /* beat the desktop #cover{overflow:hidden} ID rule */
  .work-outer{overflow:visible;flex:none;}
  .work-inner{padding:0 20px 0;}
  #intro .work-inner{padding-top:0;}

  /* ── Appbar: logo on row 1, tool icons on a full-width row below ── */
  .appbar{height:auto;}
  .appbar-inner{padding:0 20px;flex-wrap:wrap;align-items:center;gap:0;}
  .appbar-logo{margin-left:-20px;flex:0 0 auto;height:40px;}
  .appbar-logo svg{width:auto;height:100%;display:block;}
  .appbar-divider{display:none;}
  .appbar-title{display:none;}              /* title moves into body as H1 */
  .appbar-tools{flex:1 1 100%;justify-content:space-between;padding:12px 0 14px;gap:0;}
  .icon-btn{width:46px;height:46px;}
  .icon-btn svg{width:20px;height:20px;}

  /* Body H1 (replaces the appbar title on mobile) */
  .screen-title{
    display:block;font-size:clamp(22px,6.4vw,27px);font-weight:800;
    letter-spacing:-.01em;line-height:1.18;color:var(--ink);
    margin:18px 0 14px;
  }

  /* ── Cover: stacked title → art → button ── */
  .cover-art{display:none;}                 /* hide desktop absolute art */
  .cover-stage{
    flex-direction:column;align-items:stretch;
    padding:22px 20px 28px;min-height:auto;flex:none;
  }
  .cover-text{max-width:none;display:flex;flex-direction:column;}
  .cover-title{font-size:clamp(28px,8vw,40px);margin-bottom:8px;order:1;}
  .cover-art-mobile{display:block;width:100%;max-width:340px;
    margin:6px auto 22px;order:2;position:relative;}
  .cover-art-mobile .cover-path{width:100%;height:auto;display:block;overflow:visible;}
  .cover-art-mobile .thumb{
    width:clamp(34px,15%,50px);height:clamp(34px,15%,50px);
    opacity:1;transform:translate(-50%,-50%) scale(1);
  }
  .btn-start{width:100%;max-width:none;height:52px;font-size:16px;order:3;}
  /* faint rule under the button, as in the mockup */
  .cover-text::after{content:'';display:block;height:1px;
    background:var(--rule);margin-top:30px;order:4;}

  /* ── Intro = single scrolling page: title, copy, accordion ── */
  .intro-body{min-height:auto;padding:4px 0 8px;display:block;}
  .intro-bg{display:none;}
  .intro-copy{max-width:none;}
  .intro-copy p{font-size:15px;line-height:1.6;margin-bottom:14px;}

  /* Hide the horizontal timeline strip; the accordion replaces it */
  .tl-wrap{display:none !important;}

  /* Ensure accordion is visible on mobile */
  #mobileTimeline{display:block !important;visibility:visible !important;overflow:visible;}
  
  /* Hide event screen on mobile - accordion is the primary interface */
  #event{display:none !important;}

  /* ── Event screen: stack as a single column (illustration on top, then
     year/title/description) to mirror the accordion's expanded view. Mobile
     primarily uses the accordion, but this keeps the event screen clean if
     it is ever reached (e.g. navigating on desktop, then narrowing). ── */
  .work-body{display:flex;flex-direction:column;margin:0;padding:6px 0 24px;}
  .ev-illo{order:-1;justify-content:flex-start;align-items:flex-start;
    padding:0;margin:4px auto 16px;width:100%;max-width:260px;}
  .ev-illo-inner{max-width:260px;}
  .ev-head{margin-bottom:6px;}
  .ev-year{font-size:26px;}
  .ev-title{font-size:18px;}
  .ev-rule{margin:10px 0 12px;}
  .ev-desc{font-size:14px;line-height:1.7;}

  /* ── Accordion timeline ── */
  .acc{display:block;margin-top:6px;padding-bottom:28px;}
  .acc-item{position:relative;margin:0;}  /* remove margin gaps */
  .acc-row{
    width:100%;display:flex;align-items:flex-start;gap:14px;
    padding:12px 0;text-align:left;background:none;border:none;
    cursor:pointer;position:relative;z-index:2;margin-left:0;
  }
  /* connector line running behind the circles - continuous unbroken line */
  .acc-row::before{
    content:'';position:absolute;left:19px;top:-14px;bottom:-14px;width:2px;
    background:rgba(31,46,122,.25);z-index:0;
  }
  /* Trim connector at first item top (leave room for circle) */
  .acc-item:first-child .acc-row::before{top:18px;}
  /* Trim connector at last item bottom (leave room for circle) */
  .acc-item:last-child  .acc-row::before{bottom:18px;}
  /* Ensure selected number stays inline, doesn't float */
  .acc-num{position:relative;z-index:1;}
  .acc-item.open .acc-num{transform:none;display:grid;place-items:center;}
  .acc-numwrap{position:relative;flex:none;width:40px;display:flex;justify-content:center;}
  .acc-num{
    width:40px;height:40px;border-radius:50%;border:1.5px solid var(--blue);
    background:#fff;color:var(--blue);font-weight:700;font-size:14px;
    display:grid;place-items:center;position:relative;z-index:1;
  }
  .acc-meta{display:flex;flex-direction:column;padding-top:6px;gap:3px;}
  .acc-year{font-size:15px;font-weight:700;color:var(--ink);}
  .acc-title{font-size:14px;font-weight:400;color:var(--muted);line-height:1.35;}

  /* expanded panel */
  .acc-panel{max-height:0;overflow:hidden;padding:8px 0 20px;
    transition:max-height 0.3s ease-in-out,opacity 0.3s ease-in-out;opacity:0;}
  .acc-row{transition:opacity 0.2s ease-in-out;}
  .acc-item.open .acc-row{opacity:0;pointer-events:none;}
  .acc-item.open .acc-panel{max-height:2000px;opacity:1;}
  .acc-illo{
    position:relative;width:100%;max-width:260px;margin:4px auto 16px;
    aspect-ratio:1/1;
  }
  .acc-illo-inner{width:100%;height:100%;display:grid;place-items:center;}
  .acc-illo-inner svg,.acc-illo-inner img{width:100%;height:100%;object-fit:contain;display:block;}
  .acc-badge{
    position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;
    background:var(--navy-deep);color:#fff;font-weight:700;font-size:14px;
    display:grid;place-items:center;z-index:2;
    box-shadow:0 0 0 3px var(--teal);
  }
  .acc-year-lg{font-size:26px;font-weight:800;color:var(--red);line-height:1;margin-bottom:6px;}
  .acc-title-lg{font-size:18px;font-weight:800;color:var(--ink);line-height:1.25;margin-bottom:12px;}
  .acc-desc{font-size:14px;line-height:1.7;color:var(--ink);}
}

/* Fallback for modern browsers with container query support */
@container(max-width:700px){
  html,body{overflow:auto;height:auto;}
  .screen{height:auto;min-height:100vh;min-height:100dvh;overflow:visible;}
  #cover{overflow:visible;}   /* beat the desktop #cover{overflow:hidden} ID rule */
  .work-outer{overflow:visible;flex:none;}
  .work-inner{padding:0 20px 0;}
  #intro .work-inner{padding-top:0;}

  /* ── Appbar: logo on row 1, tool icons on a full-width row below ── */
  .appbar{height:auto;}
  .appbar-inner{padding:0 20px;flex-wrap:wrap;align-items:center;}
  .appbar-logo{margin-left:-20px;flex:0 0 auto;}
  .appbar-divider{display:none;}
  .appbar-title{display:none;}              /* title moves into body as H1 */
  .appbar-tools{flex:1 1 100%;justify-content:space-between;padding:12px 0 14px;gap:0;}
  .icon-btn{width:46px;height:46px;}
  .icon-btn svg{width:20px;height:20px;}

  /* Body H1 (replaces the appbar title on mobile) */
  .screen-title{
    display:block;font-size:clamp(22px,6.4vw,27px);font-weight:800;
    letter-spacing:-.01em;line-height:1.18;color:var(--ink);
    margin:18px 0 14px;
  }

  /* ── Cover: stacked title → art → button ── */
  .cover-art{display:none;}                 /* hide desktop absolute art */
  .cover-stage{
    flex-direction:column;align-items:stretch;
    padding:22px 20px 28px;min-height:auto;flex:none;
  }
  .cover-text{max-width:none;display:flex;flex-direction:column;}
  .cover-title{font-size:clamp(28px,8vw,40px);margin-bottom:8px;order:1;}
  .cover-art-mobile{display:block;width:100%;max-width:340px;
    margin:6px auto 22px;order:2;position:relative;}
  .cover-art-mobile .cover-path{width:100%;height:auto;display:block;overflow:visible;}
  .cover-art-mobile .thumb{
    width:clamp(34px,15%,50px);height:clamp(34px,15%,50px);
    opacity:1;transform:translate(-50%,-50%) scale(1);
  }
  .btn-start{width:100%;max-width:none;height:52px;font-size:16px;order:3;}
  /* faint rule under the button, as in the mockup */
  .cover-text::after{content:'';display:block;height:1px;
    background:var(--rule);margin-top:30px;order:4;}

  /* ── Intro = single scrolling page: title, copy, accordion ── */
  .intro-body{min-height:auto;padding:4px 0 8px;display:block;}
  .intro-bg{display:none;}
  .intro-copy{max-width:none;}
  .intro-copy p{font-size:15px;line-height:1.6;margin-bottom:14px;}

  /* Hide the horizontal timeline strip; the accordion replaces it */
  .tl-wrap{display:none;}

  /* ── Event screen: stack as a single column (illustration on top, then
     year/title/description) to mirror the accordion's expanded view. Mobile
     primarily uses the accordion, but this keeps the event screen clean if
     it is ever reached (e.g. navigating on desktop, then narrowing). ── */
  .work-body{display:flex;flex-direction:column;margin:0;padding:6px 0 24px;}
  .ev-illo{order:-1;justify-content:flex-start;align-items:flex-start;
    padding:0;margin:4px auto 16px;width:100%;max-width:260px;}
  .ev-illo-inner{max-width:260px;}
  .ev-head{margin-bottom:6px;}
  .ev-year{font-size:26px;}
  .ev-title{font-size:18px;}
  .ev-rule{margin:10px 0 12px;}
  .ev-desc{font-size:14px;line-height:1.7;}

  /* ── Accordion timeline ── */
  .acc{display:block;margin-top:6px;padding-bottom:28px;}
  .acc-item{position:relative;}
  .acc-row{
    width:100%;display:flex;align-items:flex-start;gap:14px;
    padding:12px 0;text-align:left;background:none;border:none;
    cursor:pointer;position:relative;
  }
  /* connector line running behind the circles */
  .acc-row::before{
    content:'';position:absolute;left:19px;top:0;bottom:0;width:2px;
    background:rgba(31,46,122,.25);z-index:0;
  }
  .acc-item:first-child .acc-row::before{top:32px;}
  .acc-item:last-child  .acc-row::before{bottom:calc(100% - 32px);}
  .acc-numwrap{position:relative;flex:none;width:40px;display:flex;justify-content:center;}
  .acc-num{
    width:40px;height:40px;border-radius:50%;border:1.5px solid var(--blue);
    background:#fff;color:var(--blue);font-weight:700;font-size:14px;
    display:grid;place-items:center;position:relative;z-index:1;
  }
  .acc-meta{display:flex;flex-direction:column;padding-top:6px;gap:3px;}
  .acc-year{font-size:15px;font-weight:700;color:var(--ink);}
  .acc-title{font-size:14px;font-weight:400;color:var(--muted);line-height:1.35;}

  /* expanded panel */
  .acc-panel{max-height:0;overflow:hidden;padding:8px 0 20px;
    transition:max-height 0.3s ease-in-out,opacity 0.3s ease-in-out;opacity:0;}
  .acc-row{transition:opacity 0.2s ease-in-out;}
  .acc-item.open .acc-row{opacity:0;pointer-events:none;}
  .acc-item.open .acc-panel{max-height:2000px;opacity:1;}
  .acc-illo{
    position:relative;width:100%;max-width:260px;margin:4px auto 16px;
    aspect-ratio:1/1;
  }
  .acc-illo-inner{width:100%;height:100%;display:grid;place-items:center;}
  .acc-illo-inner svg,.acc-illo-inner img{width:100%;height:100%;object-fit:contain;display:block;}
  .acc-badge{
    position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;
    background:var(--navy-deep);color:#fff;font-weight:700;font-size:14px;
    display:grid;place-items:center;z-index:2;
    box-shadow:0 0 0 3px var(--teal);
  }
  .acc-year-lg{font-size:26px;font-weight:800;color:var(--red);line-height:1;margin-bottom:6px;}
  .acc-title-lg{font-size:18px;font-weight:800;color:var(--ink);line-height:1.25;margin-bottom:12px;}
  .acc-desc{font-size:14px;line-height:1.7;color:var(--ink);}
}


@media(max-width:400px){
  .cover-title{font-size:28px;}
  .btn-start{max-width:none;}
}

@media(prefers-reduced-motion:reduce){
  .thumb{transition:none!important;animation:none!important;}
  .fade{transition:none!important;}
  *{animation-duration:.001ms!important;}
}
</style>
